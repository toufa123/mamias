services:
  app:
    container_name: "${NAME:-mamias}_app"
    image: "${APP_IMAGE:-mamias-app:prod}"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_BUILD: prod
    user: root
    init: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      PUID: "${PUID:-33}"
      PGID: "${PGID:-33}"

      # ── Serving model: HTTP-only behind Plesk's nginx reverse proxy ──
      # Plesk terminates TLS (Let's Encrypt) and proxies to the container
      # over plain HTTP on port 8080. The container does NOT run its own
      # ACME/HTTPS (ports 80/443 are owned by Plesk). Do not set SSL_MODE.
      # See: serversideup docs → "Reverse Proxy (recommended)".
      CADDY_SERVER_ROOT: "/var/www/html/public"
      CADDY_ADMIN: "off"
      CADDY_LOG_FORMAT: "json"
      CADDY_LOG_OUTPUT: "stdout"
      CADDY_SERVER_LOG_LEVEL: "warn"
      CADDY_SERVER_EXTRA_DIRECTIVES: |
        encode zstd gzip
        header {
          X-Content-Type-Options "nosniff"
          X-Frame-Options "SAMEORIGIN"
          Referrer-Policy "strict-origin-when-cross-origin"
          Permissions-Policy "geolocation=(), microphone=(), camera=()"
          Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://cdn.jsdelivr.net blob:; frame-ancestors 'self'"
          -Server
        }

        # Same-origin reverse proxy for the Cap CAPTCHA server. The browser calls
        # /cap/{siteKey}/challenge on the app's own origin; handle_path strips the
        # /cap prefix before forwarding to the internal cap container.
        handle_path /cap/* {
          reverse_proxy cap:3000
        }

      # Trust Plesk's nginx proxy so Laravel reads X-Forwarded-Proto/Host
      # and generates https:// URLs (prevents redirect loops / mixed content).
      # The app port is bound to loopback only, so the proxy is the sole caller.
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-*}"

      # PHP/Laravel production defaults
      PHP_DISPLAY_ERRORS: "Off"
      PHP_DISPLAY_STARTUP_ERRORS: "Off"
      PHP_ERROR_REPORTING: "22527"
      PHP_OPCACHE_ENABLE: "1"
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: "0"
      APP_ENV: "production"
      APP_DEBUG: "false"
      APP_URL: "${APP_URL}"
      APP_KEY: "${APP_KEY:?APP_KEY is required}"

      # Database
      DB_CONNECTION: "pgsql"
      DB_HOST: "db"
      DB_PORT: "5432"
      DB_DATABASE: "${DB_DATABASE:?DB_DATABASE is required}"
      DB_USERNAME: "${DB_USERNAME:?DB_USERNAME is required}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      DB_SSLMODE: "${DB_SSLMODE:-require}"

      # Redis
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
      CACHE_STORE: "redis"
      SESSION_DRIVER: "redis"
      QUEUE_CONNECTION: "redis"

      # CAPTCHA (Cap standalone). Widget served same-origin via the /cap reverse
      # proxy above; verified server-side over the internal Docker network.
      CAP_SITE_KEY: "${CAP_SITE_KEY:?CAP_SITE_KEY is required — set it in .env.production}"
      CAP_SECRET_KEY: "${CAP_SECRET_KEY:?CAP_SECRET_KEY is required — set it in .env.production}"
      CAP_PUBLIC_URL: "/cap"
      CAP_INTERNAL_URL: "http://cap:3000"

      # Sessions/cookies
      SESSION_SECURE_COOKIE: "true"
      SESSION_HTTP_ONLY: "true"
      SESSION_SAME_SITE: "lax"

      # Do not expose debug tooling in production
      DEBUGBAR_ENABLED: "false"
      DEBUGBAR_STORAGE_ENABLED: "false"
      DEBUGBAR_OPEN_STORAGE: "false"

      # Keep automations explicit
      AUTORUN_ENABLED: "true"
      AUTORUN_LARAVEL_STORAGE_LINK: "true"
      AUTORUN_LARAVEL_MIGRATION: "false"
      AUTORUN_LARAVEL_CONFIG_CACHE: "true"
      AUTORUN_LARAVEL_ROUTE_CACHE: "true"
      AUTORUN_LARAVEL_VIEW_CACHE: "true"
      AUTORUN_LARAVEL_EVENT_CACHE: "true"
      AUTORUN_LARAVEL_OPTIMIZE: "true"

      STARTUP_DB_GUARD: "false"
      STARTUP_DB_GUARD_SEED: "false"

      HEALTHCHECK_PATH: "/up"

      DOCKER_DB_CONTAINER: "${NAME:-mamias}_db"
      DOCKER_BACKUP_CONTAINER: "${NAME:-mamias}_db_backup"

    # Bind to loopback only — Plesk's nginx reverse-proxies to this port.
    # Never expose the app's HTTP port directly to the public internet.
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-7080}:8080"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/up"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

    volumes:
      - backups:/var/www/backups

    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - app_net

  # ── Queue worker — processes background jobs (emails, imports) ─────
  queue:
    container_name: "${NAME:-mamias}_queue"
    image: "${APP_IMAGE:-mamias-app:prod}"
    user: root
    init: true
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      PUID: "${PUID:-33}"
      PGID: "${PGID:-33}"

      APP_ENV: "production"
      APP_DEBUG: "false"
      APP_URL: "${APP_URL}"
      APP_KEY: "${APP_KEY:?APP_KEY is required}"

      DB_CONNECTION: "pgsql"
      DB_HOST: "db"
      DB_PORT: "5432"
      DB_DATABASE: "${DB_DATABASE:?DB_DATABASE is required}"
      DB_USERNAME: "${DB_USERNAME:?DB_USERNAME is required}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      DB_SSLMODE: "${DB_SSLMODE:-require}"

      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
      CACHE_STORE: "redis"
      SESSION_DRIVER: "redis"
      QUEUE_CONNECTION: "redis"

      DEBUGBAR_ENABLED: "false"

      STARTUP_DB_GUARD: "false"
      STARTUP_DB_GUARD_SEED: "false"

    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-jobs=1000", "--max-time=3600"]

    # The base image's healthcheck curls Caddy on :8080, which this container
    # never starts (the entrypoint execs artisan directly). Replace it: the
    # worker process must be alive AND Redis — its job broker — must be
    # reachable. The [q] bracket stops pgrep from matching its own shell.
    # retries x interval must exceed the restart gap after --max-time expiry.
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          pgrep -f 'artisan [q]ueue:(work|listen)' >/dev/null
          && php -r 'exit((new Redis)->connect(getenv("REDIS_HOST") ?: "redis", (int) (getenv("REDIS_PORT") ?: 6379), 2) ? 0 : 1);'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - app_net

  db:
    image: "${POSTGIS_IMAGE:-kartoza/postgis:17-3.5}"
    container_name: "${NAME:-mamias}_db"
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: "${DB_DATABASE:?DB_DATABASE is required}"
      POSTGRES_DBNAME: "${DB_DATABASE:?DB_DATABASE is required}"
      POSTGRES_USER: "${DB_USERNAME:?DB_USERNAME is required}"
      POSTGRES_PASS: "${DB_PASSWORD:?DB_PASSWORD is required}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      POSTGRES_MULTIPLE_EXTENSIONS: "${POSTGRES_MULTIPLE_EXTENSIONS:-postgis}"
      DEFAULT_ENCODING: "${DEFAULT_ENCODING:-UTF8}"
      ALLOW_IP_RANGE: "${ALLOW_IP_RANGE:-172.16.0.0/12}"
    volumes:
      - db_data:/var/lib/postgresql
      - backups:/backups:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U \"$${DB_USERNAME}\" -d \"$${DB_DATABASE}\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - app_net

  db-backup:
    image: "${PG_BACKUP_IMAGE:-kartoza/pg-backup:latest}"
    container_name: "${NAME:-mamias}_db_backup"
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: "${DB_DATABASE:?DB_DATABASE is required}"
      POSTGRES_USER: "${DB_USERNAME:?DB_USERNAME is required}"
      POSTGRES_PASS: "${DB_PASSWORD:?DB_PASSWORD is required}"
      POSTGRES_HOST: db
      DUMPPREFIX: mamias_db
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - app_net

  redis:
    image: "${REDIS_IMAGE:-redis:7.4-alpine}"
    container_name: "${NAME:-mamias}_redis"
    command: ["sh", "-c", "redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass \"$${REDIS_PASSWORD}\""]
    env_file:
      - .env.production
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - app_net

  # ── Cap Standalone (proof-of-work CAPTCHA) ────────────────────────
  # Internal-only: reached by the browser through the app's /cap reverse proxy
  # and by the app server-side at http://cap:3000. No public port is exposed.
  #
  # FIRST DEPLOY (one-time) — each Cap server has its own key store, so the prod
  # site key differs from dev and must be provisioned once:
  #   1. Set CAP_ADMIN_KEY in .env.production.
  #   2. docker compose --env-file .env.production -f docker-compose.prod.yml up -d cap cap-valkey
  #   3. Create a site key via the Cap dashboard/API (auth: CAP_ADMIN_KEY).
  #   4. Put the returned keys in .env.production as CAP_SITE_KEY / CAP_SECRET_KEY.
  #   5. Recreate the app:  docker compose --env-file .env.production -f docker-compose.prod.yml up -d app
  cap:
    image: "${CAP_IMAGE:-tiago2/cap:latest}"
    container_name: "${NAME:-mamias}_cap"
    environment:
      ADMIN_KEY: "${CAP_ADMIN_KEY:?CAP_ADMIN_KEY is required — set it in .env.production}"
      REDIS_URL: "redis://cap-valkey:6379"
    depends_on:
      cap-valkey:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - app_net

  cap-valkey:
    image: "${VALKEY_IMAGE:-valkey/valkey:9-alpine}"
    container_name: "${NAME:-mamias}_cap_valkey"
    command: valkey-server --save 60 1 --loglevel warning --maxmemory-policy noeviction
    volumes:
      - cap_valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - app_net

volumes:
  db_data:
    name: "${NAME:-mamias}_data_prod"
  redis_data:
    name: "${NAME:-mamias}_redis_prod"
  backups:
    name: "${NAME:-mamias}_backups_prod"
  cap_valkey_data:
    name: "${NAME:-mamias}_cap_valkey_prod"

networks:
  app_net:
    name: "${NAME:-mamias}_net_prod"
