# ===================================================================================================
#  DEV-ONLY Docker Compose — Laravel 13 / FrankenPHP (serversideup/php:8.5-frankenphp)
#  / PostGIS (kartoza/postgis) / Redis / mail (axllent/mailpit)
#  Local : https://mamias.local   (self-signed cert, accept in browser)
#  WARNING: Do NOT use this file on a public/server deployment.
#           Use docker-compose.prod.yml + .env.production instead.
#  Dev : set APP_ENV=development, APP_DEBUG=true, weak secrets in .env
#  Prod  : set APP_ENV=production, APP_DEBUG=false, strong secrets in .env
#  Mail  : Mailpit (axllent/mailpit) at http://localhost:8025
# ====================================================================================================


# ============================================================
#  Laravel 13 — FrankenPHP  (custom build on serversideup/php:8.5-frankenphp)
#  Local domain : https://mamias.local
# ============================================================
#
# PRE-REQUISITES (run once on your host machine)
# ──────────────────────────────────────────────
# 1. Add the local domain to /etc/hosts (macOS / Linux):
#      echo "127.0.0.1 mamias.local" | sudo tee -a /etc/hosts
#    Windows (PowerShell as Admin):
#      Add-Content C:\Windows\System32\drivers\etc\hosts "127.0.0.1 mamias.local"
#
# 2. Create a .env file at the project root if one doesn't exist:
#      cp .env.example .env
#
# 3. Build the image before the first start:
#      docker compose build
#      docker compose up -d
#
# 4. Accept the browser self-signed certificate warning on first visit to
#    https://mamias.local — the image auto-generates it.
#
# USAGE
# ─────
#   docker compose --profile dev build          # rebuild after Dockerfile changes
#   docker compose --profile dev up -d          # start in background
#   docker compose --profile dev logs -f app    # tail logs
#   docker compose --profile dev exec app bash  # open a shell
#   docker compose --profile dev down           # stop & remove containers
# ============================================================

services :
  app :
    profiles : ["dev"]
    container_name : "${name:-mamias}_app"
    depends_on :
      db :
        condition : service_healthy
      mail :
        condition : service_healthy
      redis :
        condition : service_healthy

    # ── Build from local Dockerfile ─────────────────────────────────
    build :
      context : .
      dockerfile : Dockerfile

    # ── Run as root ──────────────────────────────────────────────────
    # Required so entrypoint.sh can chown storage/ and bootstrap/cache/.
    # The serversideup entrypoint drops to www-data before FrankenPHP starts.
    user : root
    init : true

    # ── Ports ────────────────────────────────────────────────────────
    ports :
      - "127.0.0.1:443:8443"        # HTTPS — local-only TLS / HTTP 1.1 / HTTP 2
      - "127.0.0.1:443:8443/udp"    # HTTP/3 (QUIC) local-only

    # ── Runtime filesystem ───────────────────────────────────────────
    volumes :
        - ./apps:/var/www/html:cached
        - /var/run/docker.sock:/var/run/docker.sock
        - ./backups:/var/www/backups

    env_file :
      - .env
    environment :

      PUID : "${UID:-1000}"
      PGID : "${GID:-1000}"

      # ── SSL / Domain ───────────────────────────────────────────────
      SSL_MODE : "full"
      SERVER_NAME : "mamias.local"
      CADDY_HTTP_SERVER_ADDRESS : "http://mamias.local"
      CADDY_HTTPS_SERVER_ADDRESS : "https://mamias.local"
      CADDY_AUTO_HTTPS : "on"

      # ── Caddy / FrankenPHP ─────────────────────────────────────────
      CADDY_SERVER_ROOT : "/var/www/html/public"
      CADDY_ADMIN : "off"
      CADDY_LOG_FORMAT : "console"
      CADDY_LOG_OUTPUT : "stdout"
      CADDY_SERVER_LOG_LEVEL : "warn"

      CADDY_SERVER_EXTRA_DIRECTIVES : |
        encode zstd gzip
        header {
          X-Content-Type-Options  "nosniff"
          X-Frame-Options         "SAMEORIGIN"
          X-XSS-Protection        "1; mode=block"
          Referrer-Policy         "strict-origin-when-cross-origin"
          Permissions-Policy      "geolocation=(), microphone=(), camera=()"
          Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' http://localhost:3000; frame-ancestors 'self'"
          -Server
        }

      # ── PHP INI ────────────────────────────────────────────────────
      PHP_MEMORY_LIMIT : "-1"
      PHP_MAX_EXECUTION_TIME : "900"
      PHP_MAX_INPUT_VARS : "3000"
      PHP_UPLOAD_MAX_FILE_SIZE : "100M"
      PHP_POST_MAX_SIZE : "100M"
      PHP_DATE_TIMEZONE : "UTC"

      PHP_DISPLAY_ERRORS : "On"
      PHP_DISPLAY_STARTUP_ERRORS : "On"
      PHP_ERROR_REPORTING : "32767"      # E_ALL

      PHP_OPCACHE_ENABLE : "1"
      PHP_OPCACHE_VALIDATE_TIMESTAMPS : "1"

      # ── Laravel automations ───────────────────────────────────────
      AUTORUN_ENABLED : "true"

      AUTORUN_LARAVEL_STORAGE_LINK : "true"
      AUTORUN_LARAVEL_MIGRATION : "false"
      AUTORUN_LARAVEL_MIGRATION_ISOLATION : "false"

      AUTORUN_LARAVEL_CONFIG_CACHE : "false"
      AUTORUN_LARAVEL_ROUTE_CACHE : "true"
      AUTORUN_LARAVEL_VIEW_CACHE : "true"
      AUTORUN_LARAVEL_EVENT_CACHE : "true"
      AUTORUN_LARAVEL_OPTIMIZE : "false"

      STARTUP_DB_GUARD : "true"
      STARTUP_DB_GUARD_SEED : "true"

      HEALTHCHECK_PATH : "/up"

      # ── Laravel application ───────────────────────────────────────
      APP_ENV : "local"
      APP_DEBUG : "true"
      APP_URL : "https://mamias.local"
      APP_KEY : "${APP_KEY:-}"

      DB_CONNECTION : "pgsql"
      DB_HOST : "db"
      DB_PORT : "5432"
      DB_DATABASE: "${name:-mamias}_db"
      DB_USERNAME: "${DB_USERNAME:?DB_USERNAME is required}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"

      MAIL_MAILER : "smtp"
      MAIL_HOST : "mail"
      MAIL_PORT : "1025"
      MAIL_USERNAME : ""
      MAIL_PASSWORD : ""
      MAIL_ENCRYPTION : ""
      MAIL_FROM_ADDRESS : "no-reply@mamias.local"
      MAIL_FROM_NAME: "${name:-mamias}"

      REDIS_HOST : "redis"
      REDIS_PORT : "6379"
      CACHE_STORE : "redis"
      SESSION_DRIVER : "redis"
      QUEUE_CONNECTION : "redis"

      DOCKER_DB_CONTAINER: "${name:-mamias}_db"
      DOCKER_BACKUP_CONTAINER: "${name:-mamias}_db_backup"

    healthcheck :
      test : [ "CMD", "curl", "-fk", "https://localhost:8443/up" ]
      interval : 30s
      timeout : 10s
      retries : 5
      start_period : 45s

    restart : unless-stopped

  # ── Queue worker service ───────────────────────────────────────────
  queue :
    profiles : ["dev"]
    container_name : "${name:-mamias}_queue"
    depends_on :
      app :
        condition : service_healthy
      redis :
        condition : service_healthy

    build :
      context : .
      dockerfile : Dockerfile

    user : root
    init : true

    volumes :
        - ./apps:/var/www/html:cached

    env_file :
      - .env
    environment :
      PUID : "${UID:-1000}"
      PGID : "${GID:-1000}"

      APP_ENV : "local"
      APP_DEBUG : "true"
      APP_URL : "https://mamias.local"
      APP_KEY : "${APP_KEY:-}"

      DB_CONNECTION : "pgsql"
      DB_HOST : "db"
      DB_PORT : "5432"
      DB_DATABASE: "${name:-mamias}_db"
      DB_USERNAME: "${DB_USERNAME:?DB_USERNAME is required}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"

      MAIL_MAILER : "smtp"
      MAIL_HOST : "mail"
      MAIL_PORT : "1025"
      MAIL_USERNAME : ""
      MAIL_PASSWORD : ""
      MAIL_ENCRYPTION : ""
      MAIL_FROM_ADDRESS : "no-reply@mamias.local"
      MAIL_FROM_NAME: "${name:-mamias}"

      REDIS_HOST : "redis"
      REDIS_PORT : "6379"
      CACHE_STORE : "redis"
      SESSION_DRIVER : "redis"
      QUEUE_CONNECTION : "redis"

      STARTUP_DB_GUARD : "false"
      STARTUP_DB_GUARD_SEED : "false"

    command : [ "php", "artisan", "queue:work", "--sleep=3", "--tries=3" ]

    restart : unless-stopped

  # ── PostGIS database service ───────────────────────────────────────
  db :
    profiles : ["dev"]
    image : kartoza/postgis:latest
    container_name: "${name:-mamias}_db"
    ports :
      - "127.0.0.1:${DB_FORWARD_PORT:-54321}:5432"
    env_file :
      - .env
    environment :
      POSTGRES_DB: "${name:-mamias}_db"
      POSTGRES_DBNAME: "${name:-mamias}_db"
      POSTGRES_USER: "${DB_USERNAME:?DB_USERNAME is required}"
      POSTGRES_PASS: "${DB_PASSWORD:?DB_PASSWORD is required}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      POSTGRES_MULTIPLE_EXTENSIONS : "${POSTGRES_MULTIPLE_EXTENSIONS:-postgis}"
      DEFAULT_ENCODING : "${DEFAULT_ENCODING:-UTF8}"
      ALLOW_IP_RANGE : "${ALLOW_IP_RANGE:-all}"
    volumes :
      - db_data:/var/lib/postgresql
      - ./backups:/backups:ro
      #- ./backup:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${DB_USERNAME:?DB_USERNAME is required} -d ${name:-mamias}_db || exit 1"]
      interval : 10s
      timeout : 5s
      retries : 5
      start_period : 30s
    restart : unless-stopped

  db-backup:
    profiles: ["dev"]
    image: kartoza/pg-backup:latest
    container_name: "${name:-mamias}_db_backup"
    volumes:
      - ./backups:/backups
    environment:
      - POSTGRES_DB=${name:-mamias}_db
      - POSTGRES_USER=${DB_USERNAME:?DB_USERNAME is required}
      - POSTGRES_PASS=${DB_PASSWORD:?DB_PASSWORD is required}
      - POSTGRES_HOST=db
      - DUMPPREFIX=mamias_db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── Redis service ────────────────────────────────────────────────
  redis :
    profiles : ["dev"]
    image : redis:alpine
    container_name: "${name:-mamias}_redis"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports :
      - "127.0.0.1:6379:6379"
    healthcheck :
      test : [ "CMD", "redis-cli", "ping" ]
      interval : 5s
      timeout : 5s
      retries : 5
    restart : unless-stopped

  # ── Mailpit service (SMTP catcher + web UI) ───────────────────────
  mail :
    profiles : ["dev"]
    image : axllent/mailpit:latest
    container_name: "${name:-mamias}_mail"
    ports :
      - "127.0.0.1:${MAIL_SMTP_PORT:-11025}:1025"
      - "127.0.0.1:${MAIL_WEB_PORT:-8026}:8025"
    healthcheck :
      test : [ "CMD", "wget", "-q", "-O", "-", "http://localhost:8025/livez" ]
      interval : 10s
      timeout : 5s
      retries : 10
      start_period : 15s
    restart : unless-stopped

  # ── Cap Standalone (proof-of-work CAPTCHA) ──────────────────────────
  cap :
    profiles : ["dev"]
    image : tiago2/cap:latest
    container_name: "${name:-mamias}_cap"
    ports :
      - "127.0.0.1:3000:3000"
    environment :
      ADMIN_KEY : "${CAP_ADMIN_KEY}"
      REDIS_URL : "redis://cap-valkey:6379"
    depends_on :
      cap-valkey :
        condition : service_healthy
    restart : unless-stopped

  cap-valkey :
    profiles : ["dev"]
    image : valkey/valkey:9-alpine
    container_name: "${name:-mamias}_cap_valkey"
    volumes :
      - cap-valkey-data:/data
    command : valkey-server --save 60 1 --loglevel warning --maxmemory-policy noeviction
    healthcheck :
      test : [ "CMD", "valkey-cli", "ping" ]
      interval : 5s
      timeout : 3s
      retries : 5
    restart : unless-stopped

volumes :
  db_data:
    name: "${name:-mamias}_data"
  cap-valkey-data:
    name: "${name:-mamias}_cap_valkey_data"
